name: Graphentra Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Build and run Graphentra analyzer
    runs-on: ubuntu-latest

    steps:
      - name: Check out demo application
        uses: actions/checkout@v7
        with:
          path: demo-app

      - name: Check out Graphentra analyzer
        uses: actions/checkout@v7
        with:
          repository: muhammadmohsinjs-web/hackathon-graphentra-analyzer
          ref: main
          path: graphentra-analyzer

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: graphentra-analyzer/package-lock.json

      - name: Install analyzer dependencies
        working-directory: graphentra-analyzer
        run: npm ci

      - name: Build analyzer
        working-directory: graphentra-analyzer
        run: npm run build

      - name: Run analyzer
        working-directory: graphentra-analyzer
        run: npm start -- "$GITHUB_WORKSPACE/demo-app/demo-commerce-app"
